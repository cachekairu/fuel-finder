<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Finder — Nearby Stations</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="logo">
            <span class="logo-icon">⛽</span>
            <h1>Fuel Finder</h1>
        </div>
        <button id="findBtn" class="primary-btn">
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
            Find Nearby Stations
        </button>
    </header>

    <main class="main-container">
        <div id="map"></div>
        <aside class="station-container">
            <div class="station-header">
                <h2>Nearby Stations</h2>
                <span id="stationCount" class="badge">0 found</span>
            </div>
            <div id="stationList">
                <div class="empty-state">
                    <span class="empty-icon">📍</span>
                    <p>Click "Find Nearby Stations" to locate fuel spots around you.</p>
                </div>
            </div>
        </aside>
    </main>

    <script src="script.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAvGVWaJKrvfc9B9VSjRtKqJiTNsv4xFdE&callback=initMap" async defer></script>
</body>
</html>
